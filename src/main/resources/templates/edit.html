<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактирование сеанса</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 600px">

    <h1 class="mb-4">Редактирование сеанса</h1>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/screenings/edit/{id}(id=${screening.id})}" th:object="${screening}"
                  method="post" class="row g-3">

                <div class="col-12">
                    <label class="form-label">Название фильма</label>
                    <input type="text" th:field="*{filmTitle}" class="form-control"
                           th:classappend="${#fields.hasErrors('filmTitle')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{filmTitle}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label">Киностудия</label>
                    <input type="text" th:field="*{productionCompany}" class="form-control"
                           th:classappend="${#fields.hasErrors('productionCompany')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{productionCompany}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label">Дата и время сеанса</label>
                    <input type="datetime-local" th:field="*{sessionDateTime}" class="form-control"
                           th:classappend="${#fields.hasErrors('sessionDateTime')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{sessionDateTime}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label">Количество билетов</label>
                    <input type="number" th:field="*{ticketCount}" class="form-control"
                           th:classappend="${#fields.hasErrors('ticketCount')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{ticketCount}"></div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a th:href="@{/screenings}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>

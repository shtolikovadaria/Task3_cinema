<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кинотеатр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Кинотеатр: сеансы</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-secondary">Выйти</button>
        </form>
    </div>

    <!-- Форма добавления -->
    <div class="card mb-4">
        <div class="card-header">Добавить сеанс</div>
        <div class="card-body">
            <form th:action="@{/screenings/add}" th:object="${screening}" method="post" class="row g-3">

                <div class="col-md-3">
                    <label class="form-label">Название фильма</label>
                    <input type="text" th:field="*{filmTitle}" class="form-control"
                           th:classappend="${#fields.hasErrors('filmTitle')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{filmTitle}"></div>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Киностудия</label>
                    <input type="text" th:field="*{productionCompany}" class="form-control"
                           th:classappend="${#fields.hasErrors('productionCompany')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{productionCompany}"></div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Дата и время сеанса</label>
                    <input type="datetime-local" th:field="*{sessionDateTime}" class="form-control"
                           th:classappend="${#fields.hasErrors('sessionDateTime')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{sessionDateTime}"></div>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Билетов</label>
                    <input type="number" th:field="*{ticketCount}" class="form-control"
                           th:classappend="${#fields.hasErrors('ticketCount')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{ticketCount}"></div>
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Добавить</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Поиск и сортировка -->
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <form th:action="@{/screenings}" method="get" class="d-flex gap-2 flex-grow-1">
            <input type="text" name="q" th:value="${q}" class="form-control"
                   placeholder="Поиск">
            <input type="hidden" name="sort" th:value="${sort}">
            <button type="submit" class="btn btn-outline-primary">Найти</button>
        </form>
        <a th:href="@{/screenings(q=${q}, sort='date')}" class="btn btn-outline-dark"
           th:classappend="${sort == 'date'} ? 'active'">Сортировать по дате сеанса</a>
        <a th:href="@{/screenings}" class="btn btn-outline-secondary">Сбросить</a>
    </div>

    <!-- Счётчик -->
    <p class="mb-2">Записей в таблице: <strong th:text="${count}"></strong></p>

    <!-- Таблица -->
    <table class="table table-striped table-bordered bg-white align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Название фильма</th>
            <th>Киностудия</th>
            <th>Дата и время сеанса</th>
            <th>Билетов</th>
            <th style="width: 200px">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${screenings}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.filmTitle}"></td>
            <td th:text="${s.productionCompany}"></td>
            <td th:text="${#temporals.format(s.sessionDateTime, 'dd.MM.yyyy HH:mm')}"></td>
            <td th:text="${s.ticketCount}"></td>
            <td>
                <a th:href="@{/screenings/edit/{id}(id=${s.id})}" class="btn btn-sm btn-warning">Изменить</a>
                <form th:action="@{/screenings/delete/{id}(id=${s.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Удалить этот сеанс?');">
                    <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(screenings)}">
            <td colspan="6" class="text-center text-muted">Сеансов пока нет</td>
        </tr>
        </tbody>
    </table>
    <!-- Гистограмма -->
    <div class="card mt-4">
        <div class="card-header">Количество сеансов по дням (последние 60 дней)</div>
        <div class="card-body">
            <canvas id="sessionsChart" height="90"></canvas>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const labels = /*[[${chartLabels}]]*/ [];
    const values = /*[[${chartValues}]]*/ [];

    new Chart(document.getElementById('sessionsChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Сеансов в день',
                data: values,
                backgroundColor: 'rgba(13, 110, 253, 0.7)'
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } }
            }
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px">

    <h1 class="mb-4 text-center">Кинотеатр</h1>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title mb-3">Вход в систему</h5>

            <div class="alert alert-danger" th:if="${param.error}">Неверный логин или пароль</div>
            <div class="alert alert-success" th:if="${param.logout}">Вы вышли из системы</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
        </div>
    </div>

</div>
</body>
</html>
